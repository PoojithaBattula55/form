<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Submission</title>
</head>
<body>
    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #DCEAF7;
        margin: 15px;
        padding: 0;
    }

    h1 {
        text-align: center;
        color: #3F5F9A;
        font-size: 40px;
        margin-bottom: 30px;
    }

    label {
        display: block;
        margin: 10px 0 5px;
        color: #F8FAFF;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        border: 2px solid #6F8FC4;
        box-sizing: border-box;
        background-color: #F9FBFF;
        color: #283B5C;
        border-radius: 6px;
    }

    input:focus {
        outline: none;
        border-color: #4F6FAE;
        box-shadow: 0 0 6px rgba(79, 111, 174, 0.25);
    }

    button {
        margin-top: 15px;
        padding: 10px 20px;
        font-size: 20px;
        background-color: #4F6FAE;
        color: #FFFFFF;
        border: 2px solid #4F6FAE;
        cursor: pointer;
        font-weight: bold;
        border-radius: 6px;
    }

    button:hover {
        background-color: #3D598F;
        border-color: #3D598F;
    }

    .container {
        max-width: 400px;
        margin: 50px auto;
        padding: 25px;
        background-color: #8FA8D8;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(50, 80, 130, 0.18);
    }
</style>

<main>
    <h1>Form Submission</h1>

    <form class="container" id="feedform">

        <label for="name_id">Name:</label>
        <input type="text" id="name_id" name="name_na" required>

        <label for="email_id">Email:</label>
        <input type="email" id="email_id" name="email_na" required>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required>

        <button type="submit">Submit</button>

    </form>
</main>

<script>
    // Add submit event to the form
    document.getElementById("feedform").addEventListener("submit", demofunction);

    function demofunction(event) {

        
        event.preventDefault();

        let name = document.getElementById("name_id").value;
        let age = Number(document.getElementById("age").value);

        if (age < 18) {

            alert(
                "Sorry " + name +
                ", you must be at least 18 years old to submit this form."
            );

        } else {

            alert(
                "Thank you for submitting the form, " +
                name + "!"
            );
        }
    }
</script>


</body>
</html>
